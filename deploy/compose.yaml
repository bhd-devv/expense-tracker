name: expense-tracker
x-backend: &backend
  image: expense-tracker-api:${RELEASE_TAG:-local}
  build:
    context: ..
    dockerfile: src/backend/ExpenseTracker.Api/Dockerfile
  environment: &backend-env
    ASPNETCORE_ENVIRONMENT: Production
    ConnectionStrings__Database: Host=postgres;Database=expenses;Username=expenses;Password=${POSTGRES_PASSWORD:?required}
    App__Origin: ${APP_ORIGIN:?required}
    App__KeyPath: /keys
    App__KnownProxies__0: 172.30.19.2
    Telegram__BotToken: ${TELEGRAM_BOT_TOKEN:?required}
    Telegram__BotUsername: ${TELEGRAM_BOT_USERNAME:?required}
    Telegram__ServiceKey: ${BOT_SERVICE_KEY:?required}
    OpenRouter__ApiKey: ${OPENROUTER_API_KEY:?required}
    OpenRouter__TextModel: ${OPENROUTER_TEXT_MODEL:?required}
    OpenRouter__AudioModel: ${OPENROUTER_AUDIO_MODEL:?required}
  volumes:
    - data-protection:/keys
  networks: [private]
services:
  postgres:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_DB: expenses
      POSTGRES_USER: expenses
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [private]
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U expenses -d expenses']
      interval: 5s
      timeout: 5s
      retries: 20
  migrate:
    <<: *backend
    command: [--migrate]
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy
  backend:
    <<: *backend
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://localhost:8080/api/health/ready]
      interval: 15s
      timeout: 5s
      retries: 5
  frontend:
    image: expense-tracker-web:${RELEASE_TAG:-local}
    build:
      context: ..
      dockerfile: src/frontend/Dockerfile
    networks: [private]
    restart: unless-stopped
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
  bot:
    image: expense-tracker-bot:${RELEASE_TAG:-local}
    build:
      context: ..
      dockerfile: src/bot/Dockerfile
    environment:
      BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?required}
      BOT_SERVICE_KEY: ${BOT_SERVICE_KEY:?required}
      BOT_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:?required}
      BOT_BACKEND_URL: http://backend:8080/internal/bot/
      BOT_APP_URL: ${APP_ORIGIN:?required}
    networks: [private]
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8081/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
  gateway:
    image: caddy:2.10.2-alpine
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    expose: [8080]
    networks:
      private:
        ipv4_address: 172.30.19.2
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
      bot:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://localhost:8080/api/health/ready]
      interval: 15s
      timeout: 5s
      retries: 5
networks:
  private:
    ipam:
      config:
        - subnet: 172.30.19.0/24
          ip_range: 172.30.19.128/25
volumes:
  postgres-data:
  data-protection:
