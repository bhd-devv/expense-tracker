[project]
name = "expense-tracker-bot"
version = "0.1.0"
requires-python = ">=3.13,<3.15"
dependencies = [
  "aiogram==3.31.0",
  "httpx==0.28.1",
  "pydantic-settings==2.12.0",
]

[dependency-groups]
dev = [
  "pytest==9.0.2",
  "pytest-asyncio==1.3.0",
  "ruff==0.17.3",
  "mypy==2.4.1",
  "datamodel-code-generator==0.87.0",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
