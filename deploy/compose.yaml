# Paths use the repository root, as in Coolify's --project-directory.
# Locally: docker compose --project-directory . --env-file .env -f deploy/compose.yaml ...
name: expense-tracker
x-log-options: &log-options
  LOG_DIRECTORY: /logs
  LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-14}
x-docker-logging: &docker-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"
    mode: "blocking"
x-backend: &backend
  image: expense-tracker-api:${RELEASE_TAG:-local}
  build:
    context: .
    dockerfile: src/backend/ExpenseTracker.Api/Dockerfile
  environment: &backend-env
    <<: *log-options
    LOG_SERVICE: backend
    ASPNETCORE_ENVIRONMENT: Production
    ConnectionStrings__Database: Host=postgres;Database=expenses;Username=expenses;Password=${POSTGRES_PASSWORD:?required}
    App__Origin: ${APP_ORIGIN:?required}
    App__KeyPath: /keys
    App__KnownProxies__0: 172.30.19.2
    Telegram__BotToken: ${TELEGRAM_BOT_TOKEN:?required}
    Telegram__ServiceKey: ${BOT_SERVICE_KEY:?required}
    OpenRouter__ApiKey: ${OPENROUTER_API_KEY:?required}
  volumes:
    - data-protection:/keys
    - backend-logs:/logs
  networks: [private]
  logging: *docker-logging
  init: true
  stop_grace_period: 30s
services:
  postgres:
    image: expense-tracker-postgres:${RELEASE_TAG:-local}
    build:
      context: .
      dockerfile: deploy/postgres.Dockerfile
    environment:
      <<: *log-options
      LOG_SERVICE: postgres
      POSTGRES_DB: expenses
      POSTGRES_USER: expenses
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - postgres-logs:/logs
    # SQL text/parameters can contain private expense descriptions.
    command: [postgres, -c, log_connections=on, -c, log_disconnections=on, -c, log_min_error_statement=panic, -c, log_parameter_max_length_on_error=0, -c, log_error_verbosity=terse]
    logging: *docker-logging
    init: true
    stop_grace_period: 30s
    networks: [private]
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U expenses -d expenses']
      interval: 5s
      timeout: 5s
      retries: 20
  migrate:
    <<: *backend
    environment:
      <<: *backend-env
      LOG_SERVICE: migrate
    volumes:
      - data-protection:/keys
      - migrate-logs:/logs
    command: [--migrate]
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy
  backend:
    <<: *backend
    # Coolify also attaches services to its application network. Keep the
    # gateway's API upstream on this network, where its trusted IP is fixed.
    networks:
      private:
        aliases:
          - expense-tracker-api-private
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://localhost:8080/api/health/ready]
      interval: 15s
      timeout: 5s
      retries: 5
  frontend:
    image: expense-tracker-web:${RELEASE_TAG:-local}
    build:
      context: .
      dockerfile: src/frontend/Dockerfile
    environment:
      <<: *log-options
      LOG_SERVICE: frontend
    volumes:
      - frontend-logs:/logs
    logging: *docker-logging
    init: true
    stop_grace_period: 30s
    networks: [private]
    restart: unless-stopped
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
  bot:
    image: expense-tracker-bot:${RELEASE_TAG:-local}
    build:
      context: .
      dockerfile: src/bot/Dockerfile
    environment:
      <<: *log-options
      LOG_SERVICE: bot
      BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?required}
      BOT_SERVICE_KEY: ${BOT_SERVICE_KEY:?required}
      BOT_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:?required}
      BOT_BACKEND_URL: http://backend:8080/internal/bot/
      BOT_APP_URL: ${APP_ORIGIN:?required}
    volumes:
      - bot-logs:/logs
    logging: *docker-logging
    init: true
    stop_grace_period: 30s
    networks: [private]
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8081/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
  gateway:
    image: expense-tracker-gateway:${RELEASE_TAG:-local}
    build:
      context: .
      dockerfile: deploy/gateway.Dockerfile
    environment:
      <<: *log-options
      LOG_SERVICE: gateway
    volumes:
      - gateway-logs:/logs
    logging: *docker-logging
    init: true
    stop_grace_period: 30s
    expose: [8080]
    networks:
      private:
        ipv4_address: 172.30.19.2
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
      bot:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://localhost:8080/api/health/ready]
      interval: 15s
      timeout: 5s
      retries: 5
networks:
  private:
    ipam:
      config:
        - subnet: 172.30.19.0/24
          ip_range: 172.30.19.128/25
volumes:
  postgres-data:
  data-protection:
  backend-logs:
  migrate-logs:
  bot-logs:
  frontend-logs:
  gateway-logs:
  postgres-logs:
